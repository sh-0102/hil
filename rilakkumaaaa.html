   <style>
        body {
            margin: 0;
            font-family: "Microsoft JhengHei", sans-serif;
        }

        /* ========= 最上方區塊 ========= */
        header {
            background: #9c694c;
            color: #fff;
            padding: 15px;
            font-size: 20px;
            text-align: center;
        }

        /* ========= 漢堡按鈕（手機） ========= */
        .menu-btn {
            display: none;
            font-size: 30px;
            cursor: pointer;
            padding: 10px 15px;
            background: #9c694c;
            color: #fff;
        }

        /* ========= 主選單區 ========= */
        nav {
            background: #9c9c9c;
        }

        nav ul {
            list-style: none;
            margin: 0;
            padding: 0;
        }

        nav ul li {
            position: relative;
        }

        nav > ul > li {
            display: inline-block;
        }

        nav a {
            display: block;
            padding: 12px 20px;
            color: #fff;
            text-decoration: none;
        }

        nav a:hover {
            background: #ffe1c0;
        }

        /* ========= 第二層、第三層選單 ========= */
        nav ul ul {
            display: none;
            position: absolute;
            background: #9c694c;
            min-width: 150px;
            z-index: 999;
        }

        nav ul ul li {
            display: block;
        }

        /* 滑鼠移到 li 才展開選單 */
        nav ul li:hover > ul {
            display: block;
        }

        /* 第三層偏移 */
        nav ul ul ul {
            top: 0;
            left: 150px;
            background: #ddac90;
        }

        /* ========= RWD：手機版 ========= */
        @media (max-width: 768px) {

            nav > ul > li {
                display: block;
                border-bottom: 1px solid #9c694c;
            }

            .menu-btn {
                display: block;
            }

            nav ul {
                display: none;
            }

            nav ul.active {
                display: block;
            }

            /* 手機版：次選單不再用 hover，改為點擊展開 */
            nav ul ul, nav ul ul ul {
                position: relative;
            }

            nav ul li:hover > ul {
                display: none; /* 禁用 hover */
            }

            .open > ul {
                display: block !important;
            }

            /* 點擊箭頭用 */
            .arrow {
                float: right;
                font-size: 18px;
            }
        }

        iframe {
            width: 100%;
            height: 400px;
            border: 0;
        }
    </style>
</head>

<body>

<header>Rilakkuma webside</header>

<!-- 漢堡按鈕 -->
<div class="menu-btn" onclick="toggleMenu()">☰ 選單</div>


</nav>
<nav>

</nav>

<script>
function toggleMenu() {
    document.getElementById("menu").classList.toggle("active");
}

/* 手機版：讓次選單可以用點擊展開 */
document.querySelectorAll("#menu > li > a").forEach(function (item) {
    item.addEventListener("click", function (e) {
        if (window.innerWidth <= 768) {
            let parent = this.parentElement;
            parent.classList.toggle("open");
            e.preventDefault();
        }
    });
});
</script>

</body>
